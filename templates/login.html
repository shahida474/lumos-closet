{% extends "base.html" %}
{% block content %}
<div class="login-card">
  <img class="login-logo" src="{{ url_for('static', filename='logo.jpg') }}" alt="Lumos Closet">
  <h1>{{ t('login_title') }}</h1>
  <form method="post">
    <label>{{ t('password') }}
      <input type="password" name="password" autofocus required>
    </label>
    <button type="submit" class="btn primary">{{ t('login') }}</button>
  </form>
</div>
{% endblock %}
